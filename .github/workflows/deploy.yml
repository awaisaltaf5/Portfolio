name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create config.js from repository secrets
        run: |
          cat > config.js <<EOF
          // Auto-generated at deploy time from repository secrets - do not commit.
          window.APP_CONFIG = {
            emailjs: {
              publicKey: "${{ secrets.EMAILJS_PUBLIC_KEY }}",
              serviceId: "${{ secrets.EMAILJS_SERVICE_ID }}",
              templateId: "${{ secrets.EMAILJS_TEMPLATE_ID }}"
            }
          };
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
